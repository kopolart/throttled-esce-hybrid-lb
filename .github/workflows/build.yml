name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile simulator and hybrid balancer
        run: |
          mkdir -p build/classes
          find src -name '*.java' > build/sources.txt
          javac -encoding UTF-8 -source 1.8 -target 1.8 \
            -cp "jars/*" -d build/classes @build/sources.txt
          cp -r src/resources/. build/classes/

      - name: Verify paper Table 6 configuration
        run: |
          mkdir -p build/test-classes
          javac -encoding UTF-8 -source 1.8 -target 1.8 \
            -cp "build/classes:jars/*" -d build/test-classes \
            test/cloudsim/ext/datacenter/LoadBalancerConfigTest.java
          java -cp "build/classes:build/test-classes" \
            cloudsim.ext.datacenter.LoadBalancerConfigTest
