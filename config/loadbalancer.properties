# =====================================================================
#  Hybrid Throttled-ESCE load balancer - experiment configuration
#  Three scenario presets, read at load-balancer start-up.
# =====================================================================
#
# Select the experiment scenario:
#   1 = small   (L1=30, L2=40, L3=50, idle=120 s)
#   2 = medium  (L1=27, L2=36, L3=45, idle=180 s)
#   3 = large   (L1=4,  L2=32, L3=40, idle=300 s)
#   4 = cost-lean hybrid    (L1=40, L2=55, L3=70, idle=600 s)
#   5 = latency-lean hybrid (L1=10, L2=20, L3=30, idle=60 s)
#   auto = heuristic based on the number of VMs in the data center
#
# A system property overrides this value:
#   java -Dlb.scenario=3 ...
lb.scenario=1

# ---------------------------------------------------------------------
# Scenario 1 - 7 VMs in DC1
# ---------------------------------------------------------------------
scenario.1.lowLoadThreshold=30
scenario.1.mediumLoadThreshold=40
scenario.1.highLoadThreshold=50
scenario.1.idleThresholdSeconds=120

# ---------------------------------------------------------------------
# Scenario 2 - 15 / 13 / 9 VMs across DC1 / DC2 / DC3
# ---------------------------------------------------------------------
scenario.2.lowLoadThreshold=27
scenario.2.mediumLoadThreshold=36
scenario.2.highLoadThreshold=45
scenario.2.idleThresholdSeconds=180

# ---------------------------------------------------------------------
# Scenario 3 - 50 / 21 / 24 / 31 / 16 / 14 VMs across six DCs
# ---------------------------------------------------------------------
scenario.3.lowLoadThreshold=4
scenario.3.mediumLoadThreshold=32
scenario.3.highLoadThreshold=40
scenario.3.idleThresholdSeconds=300

# ---------------------------------------------------------------------
# Scenario 4 - cost-lean hybrid (default expert for online learning)
# Packs more work per active VM and keeps fewer VMs running.
# ---------------------------------------------------------------------
scenario.4.lowLoadThreshold=40
scenario.4.mediumLoadThreshold=55
scenario.4.highLoadThreshold=70
scenario.4.idleThresholdSeconds=600
scenario.4.initialActiveRatio=0.60
scenario.4.busyFactorThreshold=0.95
scenario.4.consecutiveFailureThreshold=8

# ---------------------------------------------------------------------
# Scenario 5 - latency-lean hybrid
# Activates the full pool early and deactivates only after short idleness.
# ---------------------------------------------------------------------
scenario.5.lowLoadThreshold=10
scenario.5.mediumLoadThreshold=20
scenario.5.highLoadThreshold=30
scenario.5.idleThresholdSeconds=60
scenario.5.initialActiveRatio=1.00
scenario.5.busyFactorThreshold=0.70
scenario.5.consecutiveFailureThreshold=3

# ---------------------------------------------------------------------
# Scoring weights (0.8 on CPU/MIPS, 0.2 on RAM)
# S2 = (w * MIPS/MIPSmax + (1-w) * RAM/RAMmax) / max(L, eps)
# ---------------------------------------------------------------------
weight.cpu=0.8
weight.ram=0.2
scoring.epsilon=1.0

# ---------------------------------------------------------------------
# Elastic scaling guards. These are tuning knobs rather than
# scenario-specific values; the defaults below are the settings used
# for the archived experiments.
# ---------------------------------------------------------------------
scaling.consecutiveFailureThreshold=5
scaling.busyFactorThreshold=0.85
scaling.initialActiveRatio=0.85
