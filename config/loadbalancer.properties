# =====================================================================
#  Hybrid Throttled-ESCE load balancer - experiment configuration
#  Values are taken verbatim from Table 6 of the paper.
# =====================================================================
#
# Select the experiment scenario:
#   1 = small   (Table 6: L1=30, L2=40, L3=50, idle=120 s)
#   2 = medium  (Table 6: L1=27, L2=36, L3=45, idle=180 s)
#   3 = large   (Table 6: L1=4,  L2=32, L3=40, idle=300 s)
#   auto = heuristic based on the number of VMs in the data center
#
# A system property overrides this value:
#   java -Dlb.scenario=3 ...
lb.scenario=1

# ---------------------------------------------------------------------
# Scenario 1 - 7 VMs in DC1 (Table 6)
# ---------------------------------------------------------------------
scenario.1.lowLoadThreshold=30
scenario.1.mediumLoadThreshold=40
scenario.1.highLoadThreshold=50
scenario.1.idleThresholdSeconds=120

# ---------------------------------------------------------------------
# Scenario 2 - 15 / 13 / 9 VMs across DC1 / DC2 / DC3 (Table 6)
# ---------------------------------------------------------------------
scenario.2.lowLoadThreshold=27
scenario.2.mediumLoadThreshold=36
scenario.2.highLoadThreshold=45
scenario.2.idleThresholdSeconds=180

# ---------------------------------------------------------------------
# Scenario 3 - 50 / 21 / 24 / 31 / 16 / 14 VMs across six DCs (Table 6)
# ---------------------------------------------------------------------
scenario.3.lowLoadThreshold=4
scenario.3.mediumLoadThreshold=32
scenario.3.highLoadThreshold=40
scenario.3.idleThresholdSeconds=300

# ---------------------------------------------------------------------
# Scoring weights (Table 6: 0.8 on CPU/MIPS, 0.2 on RAM)
# Used by Eq. (3): S2 = (w * MIPS/MIPSmax + (1-w) * RAM/RAMmax) / max(L, eps)
# ---------------------------------------------------------------------
weight.cpu=0.8
weight.ram=0.2
scoring.epsilon=1.0

# ---------------------------------------------------------------------
# Elastic scaling thresholds (Eq. 6). The paper does not fix numeric
# values for these guards; these are the reference implementation values.
# ---------------------------------------------------------------------
scaling.consecutiveFailureThreshold=5
scaling.busyFactorThreshold=0.85
scaling.initialActiveRatio=0.85
